# Configuration for Mock HTTPS target for tests and benchmarks.
# Secrets and connection settings come from environment variables only (see deploy/compose/.env.example).
spring:
  application:
    name: mock-target
  mvc:
    formcontent:
      filter:
        enabled: false
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8443
  shutdown: graceful
  tomcat:
    accesslog:
      enabled: false
    max-connections: 20000
    accept-count: 2000
    max-http-form-post-size: 0
  max-http-request-header-size: 16KB
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  server:
    port: 8081
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

logging:
  structured:
    format:
      console: ecs

kairos:
  mock-target:
    max-keys: 1000000
    max-body-bytes: 1048576
    snapshot-interval: 30s
    snapshot-path: /tmp/kairos-mock-target/stats.json
    verification-keys: ${KAIROS_MOCK_TARGET_VERIFICATION_KEYS:}
