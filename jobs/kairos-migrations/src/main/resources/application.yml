# Configuration of the kairos-migrations job. Connection settings and credentials come from
# environment variables only (KAIROS_CONTROL_DB_URL, KAIROS_CELL_<n>_DB_URL, KAIROS_DB_USERNAME,
# KAIROS_DB_PASSWORD), bound to MigrationProperties. The key encryption key that seals the platform
# access-token signing keyset is the Cloud KMS key KAIROS_KEK_URI, or KAIROS_LOCAL_KEK under the local
# profile only (see the profile documents at the end).
spring:
  application:
    name: kairos-migrations
  main:
    web-application-type: none

kairos:
  migrations:
    # The role the services connect as; every table must grant it DML.
    app-role: sched_app
    # Daily partitions are created for today (UTC) and this many days ahead.
    partition-days-ahead: 3

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

logging:
  structured:
    format:
      console: ecs

---
# Local stack only: the key encryption key is a hex key from the environment. The security library refuses it under
# any other profile.
spring:
  config:
    activate:
      on-profile: local
kairos:
  security:
    kek:
      local-key: ${KAIROS_LOCAL_KEK}

---
# Every other profile seals keysets with the Cloud KMS key; the job fails to start without it.
spring:
  config:
    activate:
      on-profile: "!local"
kairos:
  security:
    kek:
      uri: ${KAIROS_KEK_URI}
