# Configuration for Kairos maintenance job and operator commands.
# Secrets and connection settings come from environment variables only (see deploy/compose/.env.example).
spring:
  application:
    name: kairos-maintenance
  main:
    web-application-type: none

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

logging:
  structured:
    format:
      console: ecs

kairos:
  maintenance:
    commands:
      enabled: false
      database:
        url: ${KAIROS_CONTROL_DB_URL}
        username: ${KAIROS_DB_USERNAME}
        password: ${KAIROS_DB_PASSWORD}
    partitions:
      enabled: true
      lock-timeout: 2s
      statement-timeout: 30s
      transaction-timeout: 2m
      purge-batch-size: 2000
  datasource:
    control:
      url: ${KAIROS_CONTROL_DB_URL}
      username: ${KAIROS_DB_USERNAME}
      password: ${KAIROS_DB_PASSWORD}
    cells:
      - url: ${KAIROS_CELL_0_DB_URL}
        username: ${KAIROS_DB_USERNAME}
        password: ${KAIROS_DB_PASSWORD}
      - url: ${KAIROS_CELL_1_DB_URL}
        username: ${KAIROS_DB_USERNAME}
        password: ${KAIROS_DB_PASSWORD}
    pool:
      maximum-size: 1
      minimum-idle: 0
