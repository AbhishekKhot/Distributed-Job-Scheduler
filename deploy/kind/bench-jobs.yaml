                secretKeyRef:
                  name: kairos-bench
                  key: postgres-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: results
              mountPath: /results
            - name: tmp
