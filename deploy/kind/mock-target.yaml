apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-target
  namespace: kairos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-target
  template:
    metadata:
      labels:
        app: mock-target
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-target
          image: kairos/mock-target:dev
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-target
  namespace: kairos
spec:
  selector:
    app: mock-target
  ports:
    - name: https
      port: 8443
      targetPort: https
    - name: management
      port: 8081
      targetPort: management
