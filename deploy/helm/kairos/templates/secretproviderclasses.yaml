{{- if .Values.runtimeSecrets.csi.enabled }}
{{- range $component := list "api" "watcher" "executor" "state" }}
{{- if index $.Values.runtimeSecrets.csi.objectsByComponent $component }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "kairos.componentName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "kairos.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  provider: {{ $.Values.runtimeSecrets.csi.provider }}
  parameters:
    secrets: |
      {{- range index $.Values.runtimeSecrets.csi.objectsByComponent $component }}
      - resourceName: {{ .resourceName | quote }}
        path: {{ .path | quote }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.operatorSession.enabled .Values.operatorSecrets.csi.enabled }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "kairos.fullname" . }}-operator
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.operatorSecrets.csi.provider }}
  parameters:
    secrets: |
      {{- range .Values.operatorSecrets.csi.objects }}
      - resourceName: {{ .resourceName | quote }}
        path: {{ .path | quote }}
      {{- end }}
{{- end }}
{{- if .Values.ownerSecrets.csi.enabled }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "kairos.fullname" . }}-owner
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.ownerSecrets.csi.provider }}
  parameters:
    secrets: |
      {{- range .Values.ownerSecrets.csi.objects }}
      - resourceName: {{ .resourceName | quote }}
        path: {{ .path | quote }}
      {{- end }}
{{- end }}
