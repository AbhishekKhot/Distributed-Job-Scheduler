{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kairos.fullname" . }}-default-deny
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: kairos
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kairos.fullname" . }}-dns-egress
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: kairos
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- if .Values.networkPolicy.workloadIdentityEgress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kairos.fullname" . }}-workload-identity-egress
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: kairos
  policyTypes:
    - Egress
  egress:
    {{- range .Values.networkPolicy.workloadIdentityEgress.endpoints }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        {{- range .ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.networkPolicy.infrastructureEgress.cidrs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kairos.fullname" . }}-infrastructure-egress
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: kairos
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range .Values.networkPolicy.infrastructureEgress.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- toYaml .Values.networkPolicy.infrastructureEgress.ports | nindent 8 }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kairos.fullname" . }}-api-ingress
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kairos.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.apiIngress.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.apiIngress.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kairos.fullname" . }}-api-to-executor
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kairos.selectorLabels" (dict "root" . "component" "executor") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kairos.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kairos.fullname" . }}-api-to-executor-egress
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kairos.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "kairos.selectorLabels" (dict "root" . "component" "executor") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
{{- if .Values.networkPolicy.monitoringIngress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kairos.fullname" . }}-monitoring-ingress
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: kairos
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.monitoringIngress.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.monitoringIngress.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8081
{{- end }}
{{- if .Values.networkPolicy.executorTargetEgress.cidrs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kairos.fullname" . }}-executor-target-egress
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kairos.selectorLabels" (dict "root" . "component" "executor") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range .Values.networkPolicy.executorTargetEgress.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- toYaml .Values.networkPolicy.executorTargetEgress.ports | nindent 8 }}
{{- end }}
{{- end }}
