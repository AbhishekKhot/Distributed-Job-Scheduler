{{- range $component := list "api" "watcher" "executor" "state" "migrations" "maintenance" "operator" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kairos.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "kairos.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- if or (eq $component "migrations") (index $.Values.serviceAccounts $component).annotations }}
  annotations:
    {{- if eq $component "migrations" }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- end }}
    {{- with (index $.Values.serviceAccounts $component).annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
