# Configuration for Kairos state processor: settles results in batches.
# Secrets and connection settings come from environment variables only (see deploy/compose/.env.example).
spring:
  application:
    name: kairos-state
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

logging:
  structured:
    format:
      console: ecs


kairos:
  state:
    stats:
      enabled: true
      flush-interval: 10s
      maximum-buckets: 100000
    workflow:
      enabled: true
      reconcile-interval: 1s
    settle:
      enabled: true
      group-id: kairos-state-results
      max-poll-records: 1000
      poll-timeout: 250ms
      retry-delay: 500ms
      audit-interval: 1s
  datasource:
    control:
      url: ${KAIROS_CONTROL_DB_URL}
      username: ${KAIROS_DB_USERNAME}
      password: ${KAIROS_DB_PASSWORD}
    cells:
      - url: ${KAIROS_CELL_0_DB_URL}
        username: ${KAIROS_DB_USERNAME}
        password: ${KAIROS_DB_PASSWORD}
      - url: ${KAIROS_CELL_1_DB_URL}
        username: ${KAIROS_DB_USERNAME}
        password: ${KAIROS_DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAIROS_KAFKA_BOOTSTRAP_SERVERS}
    client-id-prefix: kairos-state

---
spring:
  config:
    activate:
      on-profile: local
kairos:
  security:
    kek:
      local-key: ${KAIROS_LOCAL_KEK}

---
spring:
  config:
    activate:
      on-profile: "!local"
kairos:
  security:
    kek:
      uri: ${KAIROS_KEK_URI:}
