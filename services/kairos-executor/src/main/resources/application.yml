# Configuration for Kairos executor: run lock, fenced claim, HTTPS calls to team endpoints.
# Secrets and connection settings come from environment variables only (see deploy/compose/.env.example).
spring:
  application:
    name: kairos-executor
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

logging:
  structured:
    format:
      console: ecs

kairos:
  executor:
    consumer:
      high-water: 4000
      low-water: 3000
      defer-delay: 1s
      poll-timeout: 100ms
  datasource:
    control:
      url: ${KAIROS_CONTROL_DB_URL}
      username: ${KAIROS_DB_USERNAME}
      password: ${KAIROS_DB_PASSWORD}
    cells:
      - url: ${KAIROS_CELL_0_DB_URL}
        username: ${KAIROS_DB_USERNAME}
        password: ${KAIROS_DB_PASSWORD}
      - url: ${KAIROS_CELL_1_DB_URL}
        username: ${KAIROS_DB_USERNAME}
        password: ${KAIROS_DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAIROS_KAFKA_BOOTSTRAP_SERVERS}
    client-id-prefix: kairos-executor
