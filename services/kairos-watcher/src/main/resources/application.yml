# Configuration for Kairos watcher: shard leases, fire and delayed pollers, outbox relay, recovery sweepers.
# Secrets and connection settings come from environment variables only (see deploy/compose/.env.example).
spring:
  application:
    name: kairos-watcher
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

logging:
  structured:
    format:
      console: ecs

kairos:
  watcher:
    enabled: true
    heartbeat-interval: 5s
    heartbeat-stale-after: 15s
    lease-ttl: 15s
    stop-before-lease-expiry: 3s
    retained-surplus-leases: 2
    shard-group-size: 8
    poll-jitter: 200ms
    version: ${KAIROS_VERSION:dev}
  engine:
    runs:
      dispatch-horizon: 5s
  datasource:
    control:
      url: ${KAIROS_CONTROL_DB_URL}
      username: ${KAIROS_DB_USERNAME}
      password: ${KAIROS_DB_PASSWORD}
    cells:
      - url: ${KAIROS_CELL_0_DB_URL}
        username: ${KAIROS_DB_USERNAME}
        password: ${KAIROS_DB_PASSWORD}
      - url: ${KAIROS_CELL_1_DB_URL}
        username: ${KAIROS_DB_USERNAME}
        password: ${KAIROS_DB_PASSWORD}
